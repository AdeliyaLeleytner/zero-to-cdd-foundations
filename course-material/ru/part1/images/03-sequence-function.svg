<rect width="760" height="575" rx="12" fill="white"/><text x="380" y="42" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#187b73">Химическая цепь → набор состояний → функция</text><rect x="100" y="75" width="560" height="86" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="380.0" y="109" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Последовательность</text><text x="380.0" y="140" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">… A — G — S — K — L — …</text><path d="M380,169 L380,198" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><path d="M160 255 C90 195 255 185 235 263 C210 337 107 286 174 245 C246 209 255 328 160 306" fill="none" stroke="#187b73" stroke-width="9" stroke-linecap="round"/><path d="M545 215 C628 208 655 279 596 300 C530 333 495 281 555 263 C614 242 644 339 541 334" fill="none" stroke="#6d8493" stroke-width="9" stroke-linecap="round"/><path d="M300,262 L455,262" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><path d="M455,280 L300,280" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><text x="190" y="363" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#243746">Состояние 1</text><text x="570" y="363" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#243746">Состояние 2</text><text x="380" y="404" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#586b7a">Вероятности зависят от среды и партнёров.</text><path d="M380,420 L380,449" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><rect x="100" y="462" width="560" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="380.0" y="496" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Функция</text><text x="380.0" y="527" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">Реакция, сигнал, транспорт или другая работа</text></svg>
