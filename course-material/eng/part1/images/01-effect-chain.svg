<svg xmlns="http://www.w3.org/2000/svg" width="760" height="494" viewBox="0 0 760 494" role="img">
<title>From a molecule to a change in function</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#586b7a"/></marker></defs>
<rect width="760" height="494" rx="12" fill="white"/><rect x="110" y="24" width="540" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="380.0" y="58" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Molecule in its environment</text><text x="380.0" y="89" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">Where is the molecule?</text><path d="M380,118 L380,137" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><rect x="110" y="144" width="540" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="380.0" y="178" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Access to the target</text><text x="380.0" y="209" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">What concentration is available?</text><path d="M380,238 L380,257" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><rect x="110" y="264" width="540" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="380.0" y="298" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Interaction</text><text x="380.0" y="329" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">Does a complex form?</text><path d="M380,358 L380,377" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><rect x="110" y="384" width="540" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="380.0" y="418" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Change in function</text><text x="380.0" y="449" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">How does the system change?</text></svg>
