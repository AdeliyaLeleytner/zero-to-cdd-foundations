<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img">
<title>The iterative logic of drug discovery</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#586b7a"/></marker></defs>
<rect width="760" height="390" rx="12" fill="white"/><rect x="40" y="35" width="300" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="190.0" y="69" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Hypothesis</text><text x="190.0" y="100" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">What change do we want?</text><rect x="420" y="35" width="300" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="570.0" y="69" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Molecules</text><text x="570.0" y="100" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">What will we test?</text><rect x="420" y="205" width="300" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="570.0" y="239" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Experiment</text><text x="570.0" y="270" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">What do we observe?</text><rect x="40" y="205" width="300" height="90" rx="12" fill="#f0f6f5" stroke="#c9ddda"/><text x="190.0" y="239" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#187b73">Explanation</text><text x="190.0" y="270" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#586b7a">What have we learned?</text><path d="M348,80 L408,80" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><path d="M570,135 L570,194" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><path d="M410,250 L350,250" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" /><path d="M190,196 L190,136" fill="none" stroke="#586b7a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="380" y="354" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#586b7a">The next round can change both the molecule and the hypothesis.</text></svg>
